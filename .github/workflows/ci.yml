name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check src research tests scripts
      - run: ruff check src research tests scripts
      - run: mypy src research/cta_research
      - run: pytest          # 依赖完整本地数据的测试会跳过;样例数据测试照常运行
