[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-china-futures"
version = "0.1.0"
description = "Contract-level CTA research and production system for Chinese commodity futures (trend + carry), built for deployability."
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "pyarrow>=14", "pydantic>=2", "pyyaml>=6", "typer>=0.12", "rich>=13",
  "scipy>=1.10", "statsmodels>=0.14", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[project.scripts]
cta = "cta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
