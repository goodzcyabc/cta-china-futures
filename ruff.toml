line-length = 110
target-version = "py312"
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "PL"]
# 数值函数多参数 / typer 默认值惯用法 / CLI 延迟导入 / zip 不强制 strict
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "E501", "PLR0917", "B008", "PLC0415", "B905"]  # B905: zip(strict=) 不强制,保持原有行为
